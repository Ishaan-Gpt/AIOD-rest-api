name: "Documentation"
description: "Report missing or incorrect documentation"
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation. Please point us to the page or area that needs attention.
  - type: input
    id: page
    attributes:
      label: "Documentation page or area"
      description: "Which page or section of the documentation is this about?"
      placeholder: "e.g. https://aiondemand.github.io/AIOD-rest-api/... or the README section on ..."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: "What is missing or incorrect?"
      description: "Describe what is wrong, outdated, or missing."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested improvement"
      description: "If you have a concrete suggestion for the fix, describe it here."
