name: "Feature request"
description: "Suggest an idea or enhancement for the AIOD REST API"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the feature and why it would help.
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem? Please describe."
      description: "A clear and concise description of the problem this feature would solve."
      placeholder: "I need to ..., but currently ..."
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "Any alternative solutions or features you have considered."
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How important is this feature to you?"
      multiple: false
      options:
        - "Low"
        - "Medium"
        - "High"
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context, links, or screenshots about the feature request here."
