name: "Security report"
description: "Report a security vulnerability"
title: "[Security]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a security issue. If the vulnerability is sensitive, please report it privately using GitHub's private vulnerability reporting on this repository instead of this form, so the details are not disclosed publicly.
  - type: input
    id: component
    attributes:
      label: "Affected component or endpoint"
      description: "Which part of the API is affected?"
      placeholder: "e.g. GET /datasets/v1/{identifier}"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the vulnerability"
      description: "A clear description of the vulnerability and how it could be exploited."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Steps to reproduce the vulnerability, if it is safe to share them here."
  - type: textarea
    id: impact
    attributes:
      label: "Potential impact"
      description: "What could an attacker achieve by exploiting this?"
