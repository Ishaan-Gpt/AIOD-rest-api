name: "Bug report"
description: "Report a bug in the AIOD REST API"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below so we can reproduce it and fix it.
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "Searching for datasets with ... returns an unexpected result."
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: "Server"
      description: "Which server were you connecting to when the bug occurred?"
      placeholder: "e.g. api.aiod.eu"
  - type: input
    id: error-reference
    attributes:
      label: "Error reference code"
      description: "If the server provided a reference code, please provide it (a hexadecimal string)."
      placeholder: "e.g. d47cb85f6cf64c158dbb65e1a891903f"
  - type: textarea
    id: reproduce
    attributes:
      label: "To Reproduce"
      description: "Steps or queries to reproduce the bug. Preferably a minimal, reproducible example."
      placeholder: |
        1. Send a GET request to ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context about the problem here."
